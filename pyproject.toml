[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moatters-reproducibility"
version = "1.0.0rc4"
description = "Reproducibility code for modular, observable, auditable and traceable patient-state reconstruction"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{name = "Sin Guan Kong"}]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["moatters*"]
